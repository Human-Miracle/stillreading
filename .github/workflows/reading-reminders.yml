name: Reading reminders

# Every hour, ask the app to nudge readers who haven't logged today. The app decides who is due:
# at most one reminder per reader every 7 hours, daytime only, only if they turned notifications on.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send due reminders
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::warning::Set the APP_URL repository variable (Settings → Secrets and variables → Actions → Variables) to the app's address, e.g. https://your-app.vercel.app"
            exit 0
          fi
          curl -fsS --max-time 90 -X POST "${APP_URL%/}/api/cron/reminders" \
            ${CRON_SECRET:+-H "Authorization: Bearer $CRON_SECRET"}
